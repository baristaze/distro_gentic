name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref. A new push to a pull request cancels the run it
# replaces; a push to main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the floor pyproject.toml declares, and the latest stable release
        python: ["3.10", "3.14"]
    steps:
      # Actions are pinned by commit; the comment names the tag the commit carries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tool versions live in .github/pins/.
      - name: read the tool pins
        id: pins
        run: |
          echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
          echo "claude=$(sed -n 's|^ *"@anthropic-ai/claude-code": *"\([^"]*\)".*|\1|p' .github/pins/package.json)" >> "$GITHUB_OUTPUT"
      # Both setup actions cache their downloads between runs. The npm cache
      # holds Claude Code and markdownlint; the uv cache holds Python, pytest,
      # ruff, and mypy. Each key is the file that pins the versions.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: .github/pins/package.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            .github/pins/requirements.txt
            Makefile
      - name: install Claude Code
        # `claude plugin validate` needs no account, so `make plugin` runs here too.
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pins.outputs.claude }}
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: make check
        run: make check

  scaffold:
    # A copy of the scaffold, made the way a product starts, passes its own
    # gates: the fast gate and the integration suite over its compose stack.
    # So the scaffold stays runnable as the platform, the engine, and the
    # guideline move.
    name: a copy of the scaffold as ${{ matrix.name }} passes its own gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One word, and two words at the longest name new.py takes, whose
        # lines grow the most.
        name: [distro, distro_operations]
    env:
      COPY: ${{ github.workspace }}/../${{ matrix.name }}
      # uv sync and uv run fail instead of rewriting a stale uv.lock.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the tool pins
        id: pins
        run: echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: scaffold/acme_root/uv.lock
      - name: copy the scaffold under a name of its own
        run: time python3 scaffold/new.py "$COPY"
      # The pnpm version comes from packageManager in the copy's package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ../${{ matrix.name }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: scaffold/acme_root/.nvmrc
      - name: make setup
        working-directory: ${{ env.COPY }}
        run: make setup
      # arch-check runs at the guideline release the copy pins, and
      # agentic-check and distro-check from the copy's own checkers/, so
      # nothing fetches them.
      - name: make check
        working-directory: ${{ env.COPY }}
        run: make check
      - name: the integration suite over the copy's compose stack
        working-directory: ${{ env.COPY }}
        run: |
          cp .env.example .env
          make infra-up
          make migrate
          make migrate-check
          make test-integration
      - name: stop the copy's stack
        if: always()
        working-directory: ${{ env.COPY }}
        run: make infra-down || true

  images:
    # A copy of the scaffold builds each of its images as its own CI's
    # `images` job builds them: the same actions, the same list, nothing
    # pushed. So an image that cannot build fails here, before a copy
    # takes the release.
    name: a copy of the scaffold builds its ${{ matrix.image }} image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The list in scaffold/acme_root/.github/workflows/ci.yml.
        image: [api, maintenance, session-runner, portal]
    env:
      COPY: ${{ github.workspace }}/../distro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: copy the scaffold under a name of its own
        run: python3 scaffold/new.py "$COPY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build ${{ matrix.image }} without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.COPY }}
          file: ${{ env.COPY }}/deployment/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
