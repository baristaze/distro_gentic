[project]
name = "acme-checkers"
version = "0.1.0"
description = "The static checkers of the layers beneath: the engine's agentic-check and the platform's distro-check, each deciding the lenses of its spec a parser can."
requires-python = ">=3.14"
# Standard library only: it reads the source with `ast` and never imports it.
dependencies = []

[project.scripts]
agentic-check = "acme.agentic_check.cli:main"
distro-check = "acme.distro_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
