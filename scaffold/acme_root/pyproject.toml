[project]
name = "acme-workspace"
version = "0.1.0"
description = "Acme: a multi-tenant system for teams of people and the agents that work alongside them."
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
# Every member ships a subpackage of the one root package `acme` (ADR 0001).
members = [
    "libs/timing",
    "om",
    "infra",
    "integrations",
    "services/api",
    "workers/maintenance",
    "workers/agent_session_runner",
    "clients/python",
    "apps/cli",
    "apps/host",
    "ops",
    "checkers",
]

[tool.uv.sources]
acme-timing = { workspace = true }
acme-om = { workspace = true }
acme-infra = { workspace = true }
acme-integrations = { workspace = true }
acme-api = { workspace = true }
acme-maintenance = { workspace = true }
acme-agent-session-runner = { workspace = true }
acme-client = { workspace = true }
acme-cli = { workspace = true }
acme-host = { workspace = true }
acme-ops = { workspace = true }
acme-checkers = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.8",
    "pyright>=1.1.414",
    "httpx>=0.28.1",
    # Pinned exactly: `make openapi` regenerates clients/python/src/acme/client/schema/
    # with it and CI checks the committed files are current.
    "datamodel-code-generator==0.82.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = [
    "om/tests",
    "infra/tests",
    "services/api/tests",
    "workers/maintenance/tests",
    "workers/agent_session_runner/tests",
    "clients/python/tests",
    "apps/cli/tests",
    "apps/host/tests",
    "ops/tests",
    "ops/audit",
    "checkers/tests",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "libs/timing/tests",
    "om/tests",
    "infra/tests",
    "integrations/tests",
    "services/api/tests",
    "workers/maintenance/tests",
    "workers/agent_session_runner/tests",
    "clients/python/tests",
    "apps/cli/tests",
    "apps/host/tests",
    "ops/tests",
    "checkers/tests",
]
markers = [
    "integration: needs the local compose stack",
    "slow: takes more than a few seconds",
    "telemetry: needs the devx profile",
    "live: reaches a live system, a model provider (which spends), a forge, or a chat; `make test-live` runs it by hand",
    "benchmark: judges an acceptance scenario and records the run; `make benchmark` runs it, never a gate",
]

# The engine's static checker (`make agentic-check`), which `checkers/`
# carries. The layout is the scaffold's, so only the package is named, and
# the Python client's types, generated from the committed OpenAPI documents
# by `make openapi` and never hand-edited, are left out, as the linter
# leaves them.
[tool.agentic-check]
package = "acme"
exclude = ["clients/python/src/acme/client/schema/**"]

# The platform's static checker (`make distro-check`), which `checkers/`
# carries beside the engine's. The layout is the scaffold's, so only the
# package is named, and the generated types are left out as above.
[tool.distro-check]
package = "acme"
exclude = ["clients/python/src/acme/client/schema.py"]

# A host takes the shared waits as the client of the gateway does: a leaf
# that imports nothing of the system, so it reaches nothing through them.
[tool.distro-check.options.PLC-10]
reaches = ["client", "timing"]

# A host runs the exec items it holds on its own disk, through the engine's
# transports, isolation, and local secrets; it dials nothing through them.
[[tool.distro-check.exception]]
rule = "PLC-10"
path = "apps/host/src/acme/apps/host/main.py"
adr = "docs/adr/2004-a-tool-call-crosses-the-wall-as-keyed-exec-work-and-runs-once.md"
reason = "a host runs the items it holds through the engine's container transport on its own disk, and reaches the platform through the client alone"

[[tool.distro-check.exception]]
rule = "PLC-10"
path = "apps/host/src/acme/apps/host/exec_relay.py"
adr = "docs/adr/2004-a-tool-call-crosses-the-wall-as-keyed-exec-work-and-runs-once.md"
reason = "a host runs the items it holds through the engine's container transport on its own disk, and reaches the platform through the client alone"

[[tool.distro-check.exception]]
rule = "PLC-10"
path = "apps/host/src/acme/apps/host/mcp.py"
adr = "docs/adr/2057-a-tenants-mcp-server-is-a-connector-its-kinds-load-and-one-inside-the-wall-runs-on-its-host.md"
reason = "a host starts an MCP server its owner names through the engine's MCP client on its own machine, and reaches the platform through the client alone"

[[tool.distro-check.exception]]
rule = "PLC-10"
path = "apps/host/src/acme/apps/host/bases.py"
adr = "docs/adr/2051-an-agent-projects-workspace-base-is-built-once-where-its-workspaces-run.md"
reason = "a host builds a workspace's base through the engine's provider and transport on its own disk, keeps it in its own store, and reaches the platform through the client alone"

# The guideline's static checker (`make arch-check`). The layout is the
# guideline's, so only the package and the project's own lists are named.
[tool.arch-check]
package = "acme"

# A revoked key's hash stays refused; the lookup reads revoked keys to
# answer "revoked".
[[tool.arch-check.exception]]
rule = "STO-26"
path = "om/src/acme/om/tenancy/storage/tables/api_keys.py"
adr = "docs/adr/0019-an-api-key-hash-stays-unique-after-revocation.md"
reason = "an api key hash digests a fresh random secret and the lookup reads revoked keys too"

# The work item's key is unique per tenant, which is the index the lens
# names; the rule's partial coverage reads the key alone.
[[tool.arch-check.exception]]
rule = "ASY-16"
path = "om/src/acme/om/work/storage/tables/work_items.py"
adr = "docs/adr/0026-the-work-items-key-is-unique-per-tenant.md"
reason = "the unique index is (org_id, idempotency_key), led by the tenant as the lens asks"

# The company site is a page, not an app: HTML and CSS on Vite, no script,
# so no React. A substitution for one page (ADR 0002), named by path, since
# DEL-12's options substitute a framework for every browser app.
[[tool.arch-check.exception]]
rule = "DEL-12"
path = "apps/site/package.json"
adr = "docs/adr/0002-technology-choices.md"
reason = "a static page with no script and no state; the portal and every app that calls the system stay React on Vite"

# The watch keeps no table: a live part is a cache in the stream service,
# and a command by hand is the relay's item and an entry in the tenant's
# event stream (ADR 2007).
[[tool.arch-check.exception]]
rule = "OM-14"
path = "om/src/acme/om/watch/__init__.py"
adr = "docs/adr/2007-a-live-view-reads-a-session-by-a-scoped-handle.md"
reason = "the watch keeps no rows: its buffers are a cache, and its records are the relay's items and the event stream"

# The levers keep no table: a finding is kept in its lever's own row, with
# the version it read, and a reading is read from the sessions, the
# agent playbooks they invoked, and the agent knowledge they recalled (ADR 2054).
[[tool.arch-check.exception]]
rule = "OM-14"
path = "om/src/acme/om/levers/__init__.py"
adr = "docs/adr/2054-a-lever-is-checked-as-a-person-publishes-it-and-read-back-from-the-sessions-that-stalled.md"
reason = "the levers keep no rows: a finding lives in its lever's row, and a reading reads the sessions and what they reached"

# The host's check boots a Linux machine with systemd as its first process,
# as root, to install the host there; no deployment builds it (ADR 2026).
[[tool.arch-check.exception]]
rule = "DEL-10"
path = "deployment/host/check/check.Dockerfile"
adr = "docs/adr/2026-the-runner-is-a-cloud-service-with-no-workspace-and-a-host-installs-as-a-user-of-its-own.md"
reason = "a test machine with systemd first, run as root to install the host; never an image a deployment ships"

# A session's pool of one in the cloud pool has an id read off its tenant
# and its session, so every process that asks for it asks for the same one
# and two never make two (ADR 2052).
[[tool.arch-check.exception]]
rule = "OM-12"
path = "om/src/acme/om/hosts/impl/manager.py"
adr = "docs/adr/2052-the-cloud-pool-runs-a-vm-per-session-whose-host-pulls-its-work.md"
reason = "a session's pool of one is named by its session, so concurrent prepares converge on one pool"

# The root's hooks wire: the engine's root hands each hook what it built so
# far, and an impl of them builds the impls a layer above adds, as a root
# does.
[tool.arch-check.options.CON-06]
roots = ["StorageInterface", "InfraInterface", "ServicesInterface", "RootHooksInterface"]

[tool.arch-check.options.CON-08]
roots = ["StorageInterface", "InfraInterface", "ServicesInterface", "RootHooksInterface"]

# The platform's services root, beside the engine's, holds a getter per
# service as the engine's does.
[tool.arch-check.options.CON-20]
roots = ["StorageInterface", "InfraInterface", "ServicesInterface", "PlatformServicesInterface"]

[[tool.arch-check.exception]]
rule = "CON-06"
path = "om/src/acme/om/root_hooks.py"
adr = "docs/adr/2064-the-platform-wires-in-files-of-its-own-and-a-product-declares-its-namespaces.md"
reason = "each hook takes the managers the engine's root built so far, at boot; it is wiring, and no request reaches it"


# The sites that build a stage above the request stage, the same list
# om/tests/unit/test_stage_construction.py holds: the helper that assembles
# a tenant context and the tenancy manager's transitions.
[tool.arch-check.options.CTX-26]
sites = [
    "om/src/acme/om/context.py::build_context",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.bootstrap",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.add_member",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.authenticate_login",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.authenticate",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.admit_operator",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.resume",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.service_context",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.member_context",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.service_contexts",
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.sweep_context",
    # A copy adds its entries below this line.
    "om/src/acme/om/tenancy/impl/manager.py::TenancyManagerImpl.delegated_context",
    "om/src/acme/om/agent_automations/root.py::agent_automation_principals",
]
builders = ["build_context"]

# The entities a reader with no tenant takes, which carry their org_id: the
# guideline's two, the claimant the control plane claims for across
# tenants, whose org_id is the wall it sits in, the identity a claimant's
# credential resolves to (a host's among them), found by its digest across
# tenants, and what a host reads of an exec item it holds, which names the
# host's own tenant for the secret store it keys by tenant.
[tool.arch-check.options.OM-02]
tenantless = [
    "OutboxRow",
    "ChangeEvent",
    "Claimant",
    "ClaimantIdentity",
    "HostIdentity",
    "ExecDetail",
]
