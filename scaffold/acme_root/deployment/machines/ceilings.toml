# The ceilings of a machine of the cloud pool, which the platform owns: the
# machine serves one session, and is that session's wall. Its egress is
# closed at the machine's network, by the security group its start names, to
# what the session's spec asks; the host holds it no further.
agent_projects = "all"
min_isolation = "vm"
egress = "open"
readable = ["/"]
people_commands = true
items_at_once = 8
