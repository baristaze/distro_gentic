[project]
name = "acme-station-daemon"
version = "0.1.0"
description = "The Acme station daemon: a least-privilege client of the gateway that pulls its lab's station work, fences every lease by its token, holds its owner's limits, and runs each station through its adapter."
requires-python = ">=3.14"
dependencies = [
    "acme-client",
    "typer>=0.15",
]

[project.scripts]
acme-station-daemon = "acme.apps.station_daemon.main:main"

[tool.uv.sources]
acme-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
