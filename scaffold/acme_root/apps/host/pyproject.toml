[project]
name = "acme-host"
version = "0.1.0"
description = "The Acme workspace host: a client of the gateway that probes its machine, enrolls once, holds its owner's ceilings, and claims only the work pinned to its pool."
requires-python = ">=3.14"
dependencies = [
    "acme-client",
    "typer>=0.15",
]

[project.scripts]
acme-host = "acme.apps.host.main:main"

[tool.uv.sources]
acme-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
