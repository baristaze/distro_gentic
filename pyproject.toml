# Tool configuration for the checkers under scripts/, their tests, and demo/.
# This repository is not a Python package: nothing here is built or
# published, and uv does not manage it as a project. The release version
# lives in .claude-plugin/plugin.json, never here.

[project]
name = "distro-gentic-checks"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.uv]
managed = false

[tool.ruff]
line-length = 130
src = ["scripts", "tests", "demo"]
include = ["scripts/**/*.py", "tests/**/*.py", "demo/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "check_skills", "conftest", "acme", "film", "scene", "stack"]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "tests", "demo"]
mypy_path = ["scripts", "tests", "demo"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# The scaffold's checkers, which tests/test_distro_check.py reads, are
# typed by the scaffold's pyright, on the Python a copy pins; the scripts
# keep the 3.10 floor above, so here they read as Any.
[[tool.mypy.overrides]]
module = ["acme.*"]
ignore_missing_imports = true

# The demo's recorder runs with Playwright, which `make demo-gif` brings;
# the type check runs without it.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
